<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>off-hours</title>
  <meta name="description" content="off-hours — architecture, research and design by Hayoon Park, Seoul. This site is under construction.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="off-hours">
  <meta property="og:description" content="Extensions from exclusions. Site under construction.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&family=La+Belle+Aurore&display=swap" rel="stylesheet">
  <style>
    /* Intro (blinds) — same as full site */
    :root { --f-sans: "Archivo", "Noto Sans KR", system-ui, sans-serif; }
    .intro-active, .intro-active body { overflow: hidden; }
    .intro { position: fixed; inset: 0; z-index: 100; }
    .intro-black { position: absolute; inset: 0; }
    .blinds { position: absolute; inset: 0; display: flex; flex-direction: column; perspective: 1400px; }
    .slat { flex: 1 1 0; margin-bottom: -1px; transform-origin: 50% 50%;
      transition: transform 700ms cubic-bezier(.6, .05, .3, 1), opacity 120ms linear 580ms; }
    .blinds-white .slat { background: #ffffff; }
    .blinds-black .slat { background: #000000; }
    .blinds.open .slat { transform: rotateX(-90deg); opacity: 0; }
    .intro-logo { position: absolute; inset: 0; display: grid; place-items: center;
      color: #ffffff; font-family: "La Belle Aurore", cursive; font-weight: 400;
      font-size: clamp(3rem, 11vw, 9.5rem); letter-spacing: 0; line-height: 1;
      transition: opacity 300ms ease-out, transform 300ms ease-out; }
    .intro-logo.out { opacity: 0; transform: translateY(-0.15em); }
    @media (prefers-reduced-motion: reduce) {
      .slat { transition: opacity 300ms linear; }
      .blinds.open .slat { transform: none; }
    }
    .intro-foot { position: absolute; left: 0; right: 0; bottom: clamp(1.25rem, 4vh, 2.5rem); margin: 0;
      text-align: center; font-family: var(--f-sans); font-size: 0.8125rem; line-height: 1.6;
      transition: opacity 300ms ease-out; }
    .intro-foot-white { color: #8a8f91; z-index: 1; }
    .intro-foot-black { color: #9a9a9a; }
    .intro-foot.out { opacity: 0; }
  </style>
  <style>
    :root { --paper: #ffffff; --ink: #141414; --mute: #55595b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper); color: var(--ink);
      font-family: "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
      display: grid; grid-template-rows: 1fr auto; min-height: 100%;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    main { display: grid; place-items: center; text-align: center; }
    .mark { width: min(180px, 42vw); height: auto; display: block; margin: 0 auto 40px; }
    h1 { font-size: 15px; font-weight: 500; margin: 0 0 6px; letter-spacing: 0.01em; }
    p { font-size: 15px; margin: 0; color: var(--mute); line-height: 1.6; }
    .mail { margin-top: 28px; color: var(--ink); }
    /* Same position & format as the black intro footer */
    footer { position: fixed; left: 0; right: 0; bottom: clamp(1.25rem, 4vh, 2.5rem); margin: 0;
      text-align: center; font-family: var(--f-sans); font-size: 0.8125rem; line-height: 1.6; color: #8a8f91; }
    a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div>
      <img class="mark" src="assets/img/offhours-mark.svg" alt="off hours">
      <h1>This site is under construction.</h1>
      <p>Please check back soon.</p>
      <p class="mail"><a href="mailto:hello@offhoursworks.com">hello@offhoursworks.com</a></p>
    </div>
  </main>
  <footer>Based in Seoul, South Korea<br>&copy; Hayoon Park <span id="y">2026</span></footer>
  <script>
    window.COPYRIGHT_YEARS = (function (s) { var n = new Date().getFullYear(); return n > s ? s + '–' + n : String(s); })(2026);
    document.getElementById('y').textContent = window.COPYRIGHT_YEARS;
  </script>
  <script src="assets/js/intro.js"></script>
</body>
</html>
