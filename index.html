<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>off-hours</title>
  <meta name="description" content="off-hours — architecture, research and design by Hayoon Park, Seoul. This site is under construction.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="off-hours">
  <meta property="og:description" content="Extensions from exclusions. Site under construction.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { --paper: #efece4; --ink: #141414; --mute: #55595b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper); color: var(--ink);
      font-family: "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
      display: grid; grid-template-rows: 1fr auto; min-height: 100%;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    main { display: grid; place-items: center; text-align: center; }
    .mark { width: min(180px, 42vw); height: auto; display: block; margin: 0 auto 40px; }
    h1 { font-size: 15px; font-weight: 500; margin: 0 0 6px; letter-spacing: 0.01em; }
    p { font-size: 15px; margin: 0; color: var(--mute); line-height: 1.6; }
    .mail { margin-top: 28px; color: var(--ink); }
    footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--mute); }
    a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div>
      <img class="mark" src="assets/img/offhours-mark.svg" alt="off hours">
      <h1>This site is under construction.</h1>
      <p>Please check back soon.</p>
      <p class="mail"><a href="mailto:hello@offhoursworks.com">hello@offhoursworks.com</a></p>
    </div>
  </main>
  <footer>
    <span>Based in Seoul, South Korea</span>
    <span>&copy; off-hours <span id="y">2026</span></span>
  </footer>
  <script>
    (function () { var s = 2026, n = new Date().getFullYear(); document.getElementById('y').textContent = n > s ? s + '–' + n : s; })();
  </script>
</body>
</html>
